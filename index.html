<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- Prevent caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Odysee TV</title>
    <!-- Use a dynamic version to bust cache -->
    <script>
        document.write('<link rel="stylesheet" href="css/main.css?v=' + Date.now() + '">');
    </script>
</head>
<body>
    <div id="app" class="app-container">
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="sidebar">
            <div class="logo">
                <img src="icons/largeIcon.png" alt="Odysee" class="logo-img" id="logo-img">
            </div>
            <ul class="nav-links">
                <li class="focusable nav-item active" data-id="nav-home">Home</li>
                <li class="focusable nav-item" data-id="nav-trending">Trending</li>
                <li class="focusable nav-item" data-id="nav-search">Search</li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <header class="top-header">
                <h1 id="page-title">Home</h1>
            </header>
            
            <div id="video-grid" class="video-grid">
                <!-- Videos will be injected here -->
            </div>
            <div id="loading" class="loading-spinner">Loading...</div>
        </main>
        
        <!-- Fullscreen Player -->
        <div id="player-container" class="player-container hidden">
            <video id="video-player" class="video-player" autoplay></video>
            <div id="custom-controls" class="custom-controls">
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>
                <div class="controls-row">
                    <button class="focusable btn-player btn-play-pause" id="btn-play-pause">&#9632;</button>
                    <span id="time-display" class="time-display">00:00 / 00:00</span>
                </div>
            </div>
        </div>
    </div>
    <!-- On-Screen Debug Console -->
    <div id="debug-console" style="position: absolute; top: 10px; right: 10px; width: 600px; height: 800px; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; font-size: 14px; z-index: 9999; padding: 10px; overflow-y: auto; border: 1px solid #0f0; pointer-events: none;">
        <div>DEBUG CONSOLE v1.0.52</div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/spatial.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
