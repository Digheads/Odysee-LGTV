<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Odysee TV</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="sidebar">
            <div class="logo">
                <img src="icons/largeIcon.png" alt="Odysee" class="logo-img" id="logo-img">
            </div>
            <ul class="nav-links">
                <li class="focusable nav-item active" data-id="nav-home">Home</li>
                <li class="focusable nav-item" data-id="nav-trending">Trending</li>
                <li class="focusable nav-item" data-id="nav-search">Search</li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <header class="top-header">
                <h1 id="page-title">Home</h1>
            </header>
            
            <div id="video-grid" class="video-grid">
                <!-- Videos will be injected here -->
            </div>
            <div id="loading" class="loading-spinner">Loading...</div>
        </main>
        
        <!-- Fullscreen Player -->
        <div id="player-container" class="player-container hidden">
            <video id="video-player" controls class="video-player"></video>
            <div class="player-controls">
                <button class="focusable btn-close-player">Close</button>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/spatial.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
