<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Odysee TV</title>
    <script>
        document.write('<link rel="stylesheet" href="css/main.css?v=' + Date.now() + '">');
    </script>
</head>

<body>
    <div id="app" class="app-container">
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="sidebar">
            <div class="logo">
                <img src="icons/largeIcon.png" alt="Odysee" class="logo-img" id="logo-img">
            </div>
            <ul class="nav-links">
                <li class="focusable nav-item" data-id="nav-search">Search</li>
                <li class="focusable nav-item" data-id="nav-login">Login</li>
                <li class="focusable nav-item active" data-id="nav-trending">Trending</li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <header class="top-header">
                <h1 id="page-title">Home</h1>
                <div id="search-container" style="display: none; margin-top: 20px;">
                    <input type="text" id="search-input" class="focusable search-input" placeholder="Keresés..."
                        style="-webkit-flex: 1; flex: 1; margin-right: 20px; padding: 15px; font-size: 24px; border-radius: 12px; border: 2px solid transparent; background: #2A2D35; color: white;" />
                    <button id="btn-search" class="focusable btn-search"
                        style="padding: 15px 40px; font-size: 24px; border-radius: 12px; background: #E2225E; color: white; border: 2px solid transparent; cursor: pointer;">Keresés</button>
                </div>
            </header>

            <div id="video-grid" class="video-grid">
                <!-- Videos will be injected here -->
            </div>
            <div id="loading" class="loading-spinner">Loading...</div>
        </main>

        <!-- Fullscreen Player -->
        <div id="player-container" class="player-container hidden">
            <div id="player-title" class="player-title"></div>
            <div id="player-loading" class="player-loading"></div>
            <video id="video-player" class="video-player" autoplay></video>
            <div id="player-error" class="player-error" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #ff5555; padding: 30px; font-size: 28px; text-align: center; border-radius: 12px; border: 2px solid #ff5555; z-index: 100; max-width: 80%;"></div>
            <div id="custom-controls" class="custom-controls">
                <div class="seeker-info-row">
                    <div id="meta-reactions" class="video-meta meta-left"></div>
                    <div class="time-container meta-right">
                        <span id="time-display" class="time-display">00:00 / 00:00</span>
                    </div>
                </div>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>
                <div class="seeker-bottom-row">
                    <div id="meta-date" class="video-meta meta-left"></div>
                    <div id="meta-views" class="video-meta meta-right"></div>
                </div>
                <div class="controls-row">
                    <button class="focusable btn-player btn-play-pause" id="btn-play-pause">&#9632;</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Fejlesztoi naplozas. Elesitesnel ezt a ket blokkot vedd ki. -->
    <script>
        // Csak akkor kell, ha az app file://-bol indul (telepitett appkent).
        // Ha a dev szerverrol toltod be (http://<ip>:3000/), hagyd kikommentezve:
        // a devlog.js magatol a betoltes helyere kuld.
        window.DEVLOG_HOST = "192.168.0.172:3000";
    </script>
    <script src="js/devlog.js"></script>

    <script src="js/api.js"></script>
    <script src="js/spatial.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
